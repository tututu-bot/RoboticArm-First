<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小臂智能桌面助手 · 控制台</title>
  <style>
    :root {
      --bg: #101418;
      --card: #1a2027;
      --line: #2b3540;
      --fg: #e8eef4;
      --dim: #8fa0b0;
      --acc: #3ea6ff;
      --warn: #ff5a5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    h1 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card>b {
      display: block;
      margin-bottom: 8px;
      color: var(--acc);
      font-weight: 600;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
    }

    .row label {
      width: 74px;
      color: var(--dim);
      flex: none;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--acc);
    }

    input[type=range]:disabled {
      opacity: 0.4;
    }

    .val {
      width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    button {
      background: #26313c;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
    }

    button:active {
      background: #33414f;
    }

    button.pri {
      background: var(--acc);
      border-color: var(--acc);
      color: #06121c;
      font-weight: 600;
    }

    button.danger {
      border-color: var(--warn);
      color: var(--warn);
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .link-on {
      color: #4ade80;
    }

    .link-off {
      color: var(--warn);
    }

    .link-busy {
      color: var(--acc);
    }

    .angles {
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
    }

    .pts {
      max-height: 150px;
      overflow: auto;
      margin: 8px 0;
      font-size: 13px;
    }

    .pts div {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed var(--line);
    }

    input[type=text],
    input[type=number] {
      background: #0d1116;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
    }

    .hint {
      color: var(--dim);
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <h1>小臂智能桌面助手 · 控制台</h1>

  <!-- ============ 状态 ============ -->
  <div class="card">
    <div class="stat">
      <span>链路：<span id="link" class="link-off">--</span></span>
      <span class="angles" id="angles">--</span>
    </div>
  </div>

  <!-- ============ 关节滑条 ============ -->
  <div class="card">
    <b>关节角度</b>
    <div id="sliders"></div>
    <div class="hint">拖动即下发（节流 80ms）；J1 为总线舵机，其余为 PWM 舵机；回放期间会暂时锁住</div>
  </div>

  <!-- ============ 轨迹 ============ -->
  <div class="card">
    <b>轨迹</b>
    <div class="btns">
      <button onclick="addPoint()">记录当前点位</button>
      <button class="danger" onclick="pts=[];renderPts()">清空</button>
    </div>
    <div class="pts" id="ptsList"></div>
    <div class="row">
      <input type="text" id="tname" placeholder="轨迹名称" style="flex:1">
      <button class="pri" onclick="saveTraj()">保存到板子</button>
    </div>
    <b style="margin-top:14px">板上轨迹</b>
    <div class="pts" id="boardList"></div>
    <div class="btns"><button onclick="loadBoard()">刷新板上轨迹</button></div>
  </div>

  <script>
    const NAMES = ['J1 底座', 'J2 大臂', 'J3 小臂', 'J4 腕俯仰', 'J5 腕旋', 'J6 夹爪'];
    let vals = [90, 90, 90, 90, 90, 90];   // 最近一次已知姿态，由 poll 同步
    let pts = [];                          // 待保存的点位列表（只存在浏览器里）

    /* ---------- 通用请求 ---------- */
    function api(path) {
      return fetch(path).then(r => r.text());
    }

    /* ---------- 滑条 ---------- */
    const box = document.getElementById('sliders');
    NAMES.forEach((nm, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>${nm}</label>
    <input type="range" min="0" max="180" value="${vals[i]}" oninput="onSlide(${i}, this.value)">
    <span class="val" id="v${i}">${vals[i]}</span>`;
      box.appendChild(row);
    });

    function onSlide(i, v) {
      vals[i] = +v;
      document.getElementById('v' + i).textContent = v;
      pushPose();
    }

    /* ---------- 回放期间锁住滑条 ---------- */
    let locked = false;
    function lockSliders(b) {
      if (b === locked) return;        // 只在状态变化时动 DOM，poll 每轮都会调
      locked = b;
      document.querySelectorAll('input[type=range]').forEach(r => { r.disabled = b; });
    }

    /* ---------- 下发姿态（节流 80ms） ---------- */
    let timer = null, pend = false;
    function pushPose() {
      if (locked) return;              // 回放中，板子只会回 busy，干脆别发
      if (timer) { pend = true; return; }
      api('/pose?a=' + encodeURIComponent(vals.join(','))).catch(() => { });
      timer = setTimeout(() => {
        timer = null;
        if (pend) { pend = false; pushPose(); }
      }, 80);
    }

    /* ---------- 点位编辑（纯前端） ---------- */
    function addPoint() {
      pts.push(vals.slice());
      renderPts();
    }
    function renderPts() {
      const el = document.getElementById('ptsList');
      el.innerHTML = '';
      if (!pts.length) {
        el.innerHTML = '<span class="hint">还没有点位，先摆好姿势再点"记录当前点位"</span>';
        return;
      }
      pts.forEach((p, i) => {
        const d = document.createElement('div');
        const s = document.createElement('span');
        s.textContent = `#${i + 1}　${p.join(' , ')}`;
        const b = document.createElement('button');
        b.textContent = '删';
        b.onclick = () => { pts.splice(i, 1); renderPts(); };
        d.appendChild(s);
        d.appendChild(b);
        el.appendChild(d);
      });
    }
    function ptString() { return pts.map(p => p.join(',')).join(';'); }

    /* ---------- 板上轨迹（NVS） ---------- */
    function saveTraj() {
      const n = document.getElementById('tname').value.trim();
      if (!n) { alert('先填轨迹名称'); return; }
      if (!pts.length) { alert('先记录点位'); return; }
      api('/traj_add?n=' + encodeURIComponent(n) + '&p=' + encodeURIComponent(ptString()))
        .then(t => {
          alert(t === 'ok' ? '已保存' : ('失败：' + t));
          if (t === 'ok') loadBoard();
        })
        .catch(() => alert('保存失败：连不上板子'));
    }
    function loadBoard() {
      api('/traj').then(txt => {
        const el = document.getElementById('boardList');
        el.innerHTML = '';
        const lines = txt.split('\n').filter(s => s.trim());
        if (!lines.length) {
          el.innerHTML = '<span class="hint">板上没有已保存的轨迹</span>';
          return;
        }
        lines.forEach(line => {
          const name = line.split(';')[0];         // 名称里不含 ';'（服务端已过滤）
          const d = document.createElement('div');
          const s = document.createElement('span');
          s.textContent = name;                    // 名称一律走 textContent，不拼进 HTML
          const acts = document.createElement('span');
          const play = document.createElement('button');
          play.textContent = '回放';
          play.onclick = () => trajPlay(name);
          const del = document.createElement('button');
          del.textContent = '删除';
          del.className = 'danger';
          del.onclick = () => trajDel(name);
          acts.appendChild(play);
          acts.appendChild(del);
          d.appendChild(s);
          d.appendChild(acts);
          el.appendChild(d);
        });
      }).catch(() => { });
    }
    function trajPlay(name) {
      api('/traj_play?n=' + encodeURIComponent(name))
        .then(t => {
          if (t !== 'ok') alert(t === 'busy' ? '正在回放，等它跑完再操作' : ('回放失败：' + t));
        })
        .catch(() => alert('回放失败：连不上板子'));
    }
    function trajDel(name) {
      api('/traj_del?n=' + encodeURIComponent(name))
        .then(t => {
          if (t === 'ok') loadBoard();
          else alert(t === 'busy' ? '正在回放，等它跑完再操作' : ('删除失败：' + t));
        })
        .catch(() => { });
    }

    /* ---------- 状态轮询 ---------- */
    function poll() {
      api('/state').then(t => {
        const p = t.trim().split(',');
        const link = document.getElementById('link');
        const busy = p[6] === '1';                           // 第 7 位：回放中
        link.textContent = busy ? '回放中' : '在线';
        link.className = busy ? 'link-busy' : 'link-on';
        lockSliders(busy);                                   // 回放期间不接受手动调角度
        const ang = [];
        for (let i = 0; i < 6 && i < p.length; i++) ang.push(p[i]);
        document.getElementById('angles').textContent = ang.join(' ');
        if (!timer) {                                        // 不打断拖动
          for (let i = 0; i < 6 && i < p.length; i++) {
            vals[i] = +p[i];
            document.querySelectorAll('input[type=range]')[i].value = p[i];
            document.getElementById('v' + i).textContent = p[i];
          }
        }
      }).catch(() => {
        const link = document.getElementById('link');
        link.textContent = '断连'; link.className = 'link-off';
      });
    }
    setInterval(poll, 500);
    poll();
    renderPts();
    loadBoard();
  </script>
</body>

</html>
