[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
build_flags =
  -Isrc/Hardware
  -Isrc/System
  -Isrc/freertos
  -mfpu=fpv4-sp-d16
  -mfloat-abi=softfp
  -DHSE_VALUE=8000000U